<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="monospace" font-size="13">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold">Piezo input — per-channel module</text>

  <!-- Option A -->
  <text x="20" y="70" font-weight="bold">Option A — minimal (try first)</text>
  <rect x="40" y="85" width="70" height="40" fill="#eef" stroke="#333"/>
  <text x="55" y="110">PIEZO</text>
  <line x1="110" y1="105" x2="200" y2="105" stroke="#333" stroke-width="2"/>
  <text x="115" y="98">inner (sig)</text>
  <line x1="110" y1="125" x2="200" y2="125" stroke="#333" stroke-width="2"/>
  <text x="115" y="140">outer (GND)</text>
  <rect x="200" y="85" width="180" height="50" fill="#efe" stroke="#333"/>
  <text x="215" y="105">3.5 mm plug</text>
  <text x="215" y="122">tip / sleeve</text>
  <line x1="380" y1="105" x2="470" y2="105" stroke="#333" stroke-width="2"/>
  <rect x="470" y="85" width="200" height="50" fill="#fee" stroke="#333"/>
  <text x="485" y="105">GEM MULTI jack</text>
  <text x="485" y="122">IN2..IN9 (1 µF AC)</text>
  <text x="40" y="160" fill="#666">HF depends on board input Z (unspecified).</text>

  <!-- Option B -->
  <text x="20" y="220" font-weight="bold">Option B — JFET buffer (recommended)</text>
  <rect x="40" y="235" width="70" height="40" fill="#eef" stroke="#333"/>
  <text x="55" y="260">PIEZO</text>
  <line x1="110" y1="255" x2="170" y2="255" stroke="#333" stroke-width="2"/>
  <text x="112" y="248">inner</text>
  <!-- bias resistor -->
  <line x1="170" y1="255" x2="190" y2="255" stroke="#333" stroke-width="2"/>
  <rect x="190" y="245" width="40" height="20" fill="#fff" stroke="#333"/>
  <text x="195" y="235">1 MΩ</text>
  <line x1="230" y1="255" x2="270" y2="255" stroke="#333" stroke-width="2"/>
  <text x="200" y="285">bias</text>
  <!-- JFET -->
  <rect x="270" y="235" width="120" height="60" fill="#efe" stroke="#333"/>
  <text x="285" y="258">2N5457</text>
  <text x="285" y="275">source follower</text>
  <line x1="390" y1="255" x2="450" y2="255" stroke="#333" stroke-width="2"/>
  <text x="392" y="248">source</text>
  <rect x="450" y="235" width="120" height="50" fill="#efe" stroke="#333"/>
  <text x="465" y="255">3.5 mm plug</text>
  <text x="465" y="272">tip</text>
  <line x1="570" y1="255" x2="620" y2="255" stroke="#333" stroke-width="2"/>
  <rect x="620" y="235" width="80" height="50" fill="#fee" stroke="#333"/>
  <text x="628" y="255">GEM jack</text>
  <text x="628" y="272">IN2..IN9</text>
  <!-- drain / GND -->
  <line x1="330" y1="295" x2="330" y2="320" stroke="#333" stroke-width="2"/>
  <text x="335" y="335">drain → 5 V</text>
  <line x1="110" y1="275" x2="110" y2="320" stroke="#333" stroke-width="2"/>
  <text x="115" y="335">outer → GND</text>

  <text x="20" y="380" fill="#666">Guarantees HF preservation (input Z ≥ 1 MΩ to the piezo).</text>
</svg>
